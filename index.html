<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VIS — Carte de bord</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Carte de bord de l'île de Vis, Croatie — restaurants, plages et lieux à voir, avec recommandations personnelles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#0A1D2B;
    --ink-2:#123049;
    --ink-3:#1B3E5C;
    --island:#E7DCBE;
    --parchment:#EDE3CC;
    --parchment-dim:#C9BFA6;
    --brass:#C9A227;
    --brass-bright:#E8C55A;
    --terracotta:#C1603C;
    --turquoise:#3FA7AE;
    --pine:#6B8A5C;
    --line: rgba(201,162,39,0.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0;
    height:100%; width:100%;
    background:var(--ink);
    font-family:'Public Sans', sans-serif;
    color:var(--parchment);
    overflow:hidden;
    overscroll-behavior:none;
    position:fixed; inset:0;
  }

  #map{ position:fixed; inset:0; z-index:1; background:var(--ink); }

  /* Teinte "carte ancienne" appliquée aux tuiles réelles, pour garder l'ambiance
     carte au trésor tout en montrant le vrai niveau de détail (rues incluses). */
  .leaflet-tile-pane{
    filter: sepia(0.55) saturate(1.6) hue-rotate(-8deg) brightness(0.92) contrast(1.08);
  }
  .leaflet-container{ background: #0B2438; font-family:'Public Sans', sans-serif; }
  .leaflet-control-attribution{
    background: rgba(10,29,43,0.75) !important;
    color: var(--parchment-dim) !important;
    font-family:'JetBrains Mono', monospace; font-size:9px !important;
    border-radius: 4px 0 0 0;
  }
  .leaflet-control-attribution a{ color: var(--brass-bright) !important; }
  .leaflet-control-zoom{ display:none; } /* on utilise nos propres boutons */

  /* ---- Marqueurs personnalisés ---- */
  .vis-pin{ display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .vis-pin .base{
    width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border: 2px solid var(--parchment);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  .vis-pin.hero .base{ border: 2.6px solid var(--brass-bright); }
  .vis-pin .star{
    position:absolute; top:-6px; right:-6px;
    font-size:12px; color: var(--brass-bright);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .vis-pin.dim{ opacity:0.12; pointer-events:none; }

  /* ---- Header cartouche ---- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:1000;
    padding: max(16px, env(safe-area-inset-top)) 16px 0 16px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
  }
  .cartouche{
    pointer-events:auto;
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    max-width: 74vw;
  }
  .cartouche .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--brass);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .cartouche h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(19px, 5vw, 28px);
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--parchment);
  }
  .cartouche p{
    margin: 4px 0 0 0;
    font-size: 11.5px;
    color: var(--parchment-dim);
    max-width: 32ch;
  }

  .compass{
    pointer-events:none;
    width: 42px; height: 42px;
    flex-shrink:0;
    opacity:0.9;
    animation: sway 9s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-4deg); }
    50%{ transform: rotate(4deg); }
  }

  /* ---- Zoom controls ---- */
  #zoomCtl{
    position:fixed; z-index:1000; right:16px; top:50%; transform: translateY(-50%);
    display:flex; flex-direction:column; gap:2px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    border-radius: 8px; overflow:hidden;
  }
  #zoomCtl button{
    width:40px; height:40px; background: var(--ink-2); color:var(--brass-bright);
    border:1px solid var(--line); font-size:19px; font-weight:700;
    -webkit-user-select:none; user-select:none;
  }
  #zoomCtl button:active{ background: var(--ink-3); }
  #zoomCtl #zoomReset{ font-size:13px; font-weight:600; }

  /* ---- Filter legend ---- */
  #legend{
    position:fixed; z-index:1000;
    left:16px; bottom: max(16px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:6px;
    pointer-events:auto;
  }
  .pill{
    font-family:'Public Sans', sans-serif;
    font-size: 12.5px;
    font-weight:600;
    color: var(--parchment);
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px 8px 10px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer;
    user-select:none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: opacity .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .pill:active{ transform: scale(0.97); }
  .pill.off{ opacity: 0.38; }
  .pill .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .pill .count{ font-family:'JetBrains Mono', monospace; color: var(--parchment-dim); font-size:11px; }

  #starnote{
    position:fixed; z-index:1000; left:16px; bottom:172px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--brass-bright);
    background: var(--ink-2); border:1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  #listToggle{
    position:fixed; z-index:1000; right:16px; bottom: max(16px, env(safe-area-inset-bottom));
    background: var(--brass-bright); color: var(--ink);
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:13px;
    border:none; border-radius: 999px; padding: 12px 18px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    display:flex; align-items:center; gap:6px;
  }

  /* ---- Bottom sheet ---- */
  #sheet{
    position:fixed; z-index:1500; left:0; right:0; bottom:0;
    background: var(--ink-2);
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    max-height: 74vh;
    transform: translateY(100%);
    transition: transform .28s ease;
    display:flex; flex-direction:column;
  }
  #sheet.open{ transform: translateY(0); }
  #sheetHandle{
    width:36px; height:4px; background: var(--line); border-radius:2px;
    margin: 10px auto 6px auto;
  }
  #sheetHead{
    padding: 0 18px 10px 18px; display:flex; justify-content:space-between; align-items:center;
    border-bottom: 1px solid var(--line);
  }
  #sheetHead h2{ font-family:'Fraunces', serif; font-size:17px; margin:0; }
  #sheetClose, #sheetBack{ background:none; border:none; color:var(--brass); font-size:22px; padding:4px; font-family:inherit; }
  #sheetBack{ font-size:14px; font-weight:700; display:none; align-items:center; gap:4px; }
  #sheetBody{ overflow-y:auto; padding: 8px 10px 28px 10px; -webkit-overflow-scrolling:touch; }

  .row{
    display:flex; gap:12px; align-items:flex-start;
    padding: 10px 8px; border-radius: 8px; cursor:pointer;
  }
  .row:active{ background: var(--ink-3); }
  .row .rdot{
    width:26px; height:26px; border-radius:50% 50% 50% 0; transform: rotate(-45deg);
    flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center;
    border: 1.5px solid var(--parchment);
  }
  .row .rdot svg{ width:12px; height:12px; transform: rotate(45deg); }
  .row .rname{ font-weight:700; font-size:13.5px; color:var(--parchment); }
  .row .rsub{ font-size:11.5px; color:var(--parchment-dim); margin-top:1px; }

  .pc{ padding: 0 0 10px 0; }
  .pc-gallery-wrap{ position:relative; }
  .pc-gallery{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    border-radius: 16px 16px 0 0; height:230px;
    background: linear-gradient(160deg, var(--ink-3), var(--ink));
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .pc-gallery::-webkit-scrollbar{ display:none; }
  .pc-gallery img.pc-photo{
    scroll-snap-align:start; flex:0 0 100%; width:100%; height:230px;
    object-fit:contain; display:none;
  }
  .pc-gallery-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border-radius:50%;
    background:rgba(10,29,43,0.55); border:1px solid rgba(237,227,204,0.35);
    color:var(--parchment); font-size:16px; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(2px); z-index:5; -webkit-user-select:none; user-select:none;
  }
  .pc-gallery-nav:active{ background:rgba(10,29,43,0.8); }
  .pc-gallery-nav.prev{ left:8px; }
  .pc-gallery-nav.next{ right:8px; }
  .pc-photo-credit{
    font-family:'JetBrains Mono', monospace; font-size:9px; color: var(--parchment-dim);
    opacity:0.7; text-align:right; padding: 3px 12px 0 0;
  }
  .pc-photo-credit a{ color: var(--parchment-dim); }
  .pc-placeholder{
    width:100%; height:230px; border-radius:16px 16px 0 0;
    position:relative; overflow:hidden;
  }
  .pc-placeholder svg{ width:100%; height:100%; display:block; }
  .pc-body{ padding: 12px 16px 6px 16px; }
  .pc-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:10px;
    letter-spacing:0.14em; text-transform:uppercase; color: var(--brass);
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:6px;
  }
  .pc h3{
    font-family:'Fraunces', serif; font-weight:600; font-size:20px;
    margin: 0 0 8px 0; color: var(--parchment); line-height:1.2;
  }
  .pc p{ font-size:13px; line-height:1.55; color: var(--parchment-dim); margin: 0 0 10px 0; }
  .pc .meta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    border: 1px solid var(--line); border-radius:4px; padding:3px 8px;
    color: var(--parchment-dim);
  }
  .pc .rec{
    font-size:12.5px; font-style: italic; color: var(--brass-bright);
    border-left: 2px solid var(--brass); padding-left:10px; margin-bottom:14px;
  }
  .pc a.gmaps{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:13px;
    color: var(--ink); background: var(--brass-bright);
    padding: 9px 14px; border-radius: 6px; text-decoration:none;
  }

  @media (min-width: 760px){
    #legend{ flex-direction:row; }
    #starnote{ left:auto; right:200px; bottom:18px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="cartouche">
    <div class="eyebrow">Otok Vis · 43.05°N 16.15°E</div>
    <h1>Carte de bord — Vis</h1>
    <p>Restaurants, plages et lieux à voir, avec mes recommandations. Zoomez pour voir les rues.</p>
  </div>
  <svg class="compass" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#C9A227" stroke-width="0.75" opacity="0.4"/>
    <path d="M50 8 L58 50 L50 92 L42 50 Z" fill="#E8C55A"/>
    <path d="M8 50 L50 42 L92 50 L50 58 Z" fill="#EDE3CC" opacity="0.85"/>
    <circle cx="50" cy="50" r="4" fill="#0A1D2B" stroke="#E8C55A" stroke-width="1.5"/>
    <text x="50" y="14" text-anchor="middle" fill="#E8C55A" font-size="9" font-family="JetBrains Mono">N</text>
  </svg>
</header>

<div id="zoomCtl">
  <button id="zoomIn">+</button>
  <button id="zoomReset">⟳</button>
  <button id="zoomOut">−</button>
</div>

<div id="starnote">★ = mes coups de cœur</div>
<div id="legend"></div>
<button id="listToggle">☰ Liste des lieux</button>

<div id="sheet">
  <div id="sheetHandle"></div>
  <div id="sheetHead">
    <button id="sheetBack">← Retour</button>
    <h2 id="sheetTitle">Tous les lieux</h2>
    <button id="sheetClose">✕</button>
  </div>
  <div id="sheetBody"></div>
</div>

function iconStarPin(){ return `<path d="M0 -6l2 4.6 5 .4-3.8 3.2 1.2 4.9L0 3.9l-4.4 2.7 1.2-4.9L-7 -1l5-.4Z" fill="#0A1D2B"/>`; }

const PLACES = [
  {cat:"resto", name:"Peškarija 1911", lat:43.0591926, lng:16.1874856, place_id:"ChIJf6tuXuCXNRMR4Zk3yK0JNNg", price:"€€€€", zone:"Riva, Vis ville", desc:"Ancienne halle aux poissons transformée en table gastronomique autour d'un comptoir en pierre centenaire ; cuisine créative et très travaillée.", rec:"La meilleure adresse de fine dining sur l'île — réservation quasi obligatoire en été.", hero:true},
  {cat:"resto", name:"Lola Bar", lat:43.0594333, lng:16.1858295, place_id:"ChIJFey8-baXNRMRGggc2gCpVN8", price:"€€€€", zone:"Vis ville", desc:"Cuisine créative méditerranéenne dans un cadre soigné, cocktails travaillés, huile d'olive maison à ne pas manquer.", rec:"Un excellent choix pour un dîner un peu plus habillé qu'une konoba classique."},
  {cat:"resto", name:"Pojoda", lat:43.0581199, lng:16.1988121, place_id:"ChIJvZn9yqiXNRMRct1d_EM11us", price:"€€€€", zone:"Kut, Vis ville", desc:"Jardin sous les citronniers, cuisine de poisson frais choisi à la table, belle carte de vugava (cépage local blanc de Vis).", rec:"Demandez la sélection du jour au poids plutôt que la carte — c'est là qu'est la qualité."},

    photo:"https://commons.wikimedia.org/wiki/Special:FilePath/George_the_Third_Fortress_on_Vis_island,_Croatia_(48693840901).jpg?width=900",
    photoCredit:"https://commons.wikimedia.org/wiki/File:George_the_Third_Fortress_on_Vis_island,_Croatia_(48693840901).jpg"},
  {cat:"resto", name:"Buffet Vis", lat:43.0604144, lng:16.1848233, place_id:"ChIJR3HTALeXNRMRsVzKueyZUn0", price:"€€€€", zone:"Ravnica, Vis ville", desc:"Institution familiale tenue par Tonči : plateau de poisson composé selon la pêche du jour, vin et huile d'olive maison.", rec:"Laissez le patron composer votre assiette — il connaît la pêche du jour mieux que n'importe quelle carte.", hero:true},
  {cat:"resto", name:"Villa Kaliopa", lat:43.0570602, lng:16.1961174, place_id:"ChIJl7mdLq-XNRMR8A_oziR-K7E", price:"€€€€", zone:"Jardin, Vis ville", desc:"Dîner dans un jardin planté de sculptures antiques et de palmiers centenaires, poisson grillé au feu de bois, cadre unique sur l'île.", rec:"Réservez pour la table dans le jardin — c'est autant l'expérience que le repas.", hero:true},

  {cat:"resto", name:"Konoba Bako", lat:43.0467721, lng:16.0870894, place_id:"ChIJhfPeZRW8NRMRzuo4Y7hgNiQ", price:"€€€€", zone:"Front de mer, Komiža", desc:"Vue sur le coucher de soleil à Komiža, langoustines et poisson grillé, vivier à poissons visible sur place.", rec:"Tenue correcte exigée en soirée — c'est la seule konoba de Komiža avec un dress code."},
  {cat:"resto", name:"Frutarija", lat:43.0579308, lng:16.1937457, place_id:"ChIJHYhVIa6XNRMREtN03BbIIek", price:"€€", zone:"Bord de mer, Vis ville", desc:"Petit bistrot ombragé sous un grand palmier, au bord de l'eau : cafés, jus frais, granola et petite carte pour le déjeuner.", rec:"Parfait pour un apéritif ou un brunch les pieds presque dans l'eau."},
  {cat:"resto", name:"Lambik", lat:43.0586031, lng:16.1992590, place_id:"ChIJ354lLq-XNRMRezwjwBbkXlA", price:"€€", zone:"Kut, Vis ville", desc:"Pizzas au feu de bois sous les arcades de pierre d'une petite place, belle carte de vins et ambiance décontractée.", rec:"Essayez la pizza 'Mamma Mia' — plusieurs voyageurs la citent parmi les meilleures pizzas du pays."},

  {cat:"resto", name:"Konoba Jastožera", lat:43.0466085, lng:16.0866383, place_id:"ChIJLYErbxW8NRMRhwYRMKXvVik", price:"€€€€", zone:"Komiža, sur pilotis", desc:"Spécialiste du homard pêché dans son propre vivier, salle en arche de brique posée sur l'eau.", rec:"L'expérience homard la plus authentique de l'île — réservez la table près de l'eau."},

  {cat:"resto", name:"Stončica", lat:43.0647294, lng:16.2414219, place_id:"ChIJm0zw3ECXNRMRACzpjsq8OoU", price:"€€€", zone:"Baie de Stončica, nord-est de l'île", desc:"Produits du potager attenant, poisson et viande grillés, ambiance familiale dans une baie tranquille.", rec:"Bon plan pour les navigateurs — beaucoup s'y arrêtent une journée entière rien que pour la table."},

/* ---------------------------------------------------------------
   CARTE LEAFLET — vraies tuiles OpenStreetMap, donc les rues,
   sentiers et bâtiments apparaissent au fur et à mesure du zoom.
--------------------------------------------------------------- */
const map = L.map('map', {
  zoomControl: false,
  attributionControl: true,
  minZoom: 10,
  maxZoom: 19,
  worldCopyJump:false,
  maxBoundsViscosity: 0.6
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const ISLAND_BOUNDS = L.latLngBounds([42.955,15.995],[43.095,16.265]);
map.fitBounds(ISLAND_BOUNDS, { padding:[10,10] });
// Bornes larges (marge généreuse) pour pouvoir explorer bien au-delà de l'île
const PAN_BOUNDS = L.latLngBounds([42.55,15.35],[43.55,17.05]);
map.setMaxBounds(PAN_BOUNDS);

document.getElementById('zoomIn').addEventListener('click', ()=> map.zoomIn());
document.getElementById('zoomOut').addEventListener('click', ()=> map.zoomOut());
document.getElementById('zoomReset').addEventListener('click', ()=> map.fitBounds(ISLAND_BOUNDS, { padding:[10,10] }));

/* ---------------------------------------------------------------
   MARQUEURS
--------------------------------------------------------------- */
function makeIcon(p){
  const cat = CATEGORIES[p.cat];
  const size = p.hero ? 30 : 26;
  return L.divIcon({
    className: '',
    iconSize: [size,size],
    iconAnchor: [size/2, size/2],
    html: `<div class="vis-pin${p.hero?' hero':''}" style="width:${size}px;height:${size}px;position:relative;">
      <div class="base" style="background:${cat.color};">
        <svg width="14" height="14" viewBox="-10 -10 20 20">${cat.icon}</svg>
      </div>
      ${p.hero ? '<span class="star">★</span>' : ''}
    </div>`
  });
}

const layerByCat = { resto: L.layerGroup(), plage: L.layerGroup(), vue: L.layerGroup() };
const markerRefs = [];

PLACES.forEach((p, idx)=>{
  const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p) });
  marker.on('click', ()=> openDetail(idx));
  marker.addTo(layerByCat[p.cat]);
  markerRefs.push(marker);
});
Object.values(layerByCat).forEach(lg => lg.addTo(map));

/* ---------------------------------------------------------------
   LÉGENDE / FILTRES
--------------------------------------------------------------- */
const legendEl = document.getElementById('legend');
const active = { resto:true, plage:true, vue:true };
function counts(){ const c={resto:0,plage:0,vue:0}; PLACES.forEach(p=>c[p.cat]++); return c; }
const CT = counts();

Object.keys(CATEGORIES).forEach(key=>{
  const cat = CATEGORIES[key];
  const pill = document.createElement('div');
  pill.className = 'pill';
  pill.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.label} <span class="count">${CT[key]}</span>`;
  pill.addEventListener('click', ()=>{
    active[key] = !active[key];
    pill.classList.toggle('off', !active[key]);
    if(active[key]) map.addLayer(layerByCat[key]); else map.removeLayer(layerByCat[key]);
    renderList();
  });
  legendEl.appendChild(pill);
});

/* ---------------------------------------------------------------
   BOTTOM SHEET (liste + détail)
--------------------------------------------------------------- */
const sheet = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
const sheetTitle = document.getElementById('sheetTitle');
const sheetBack = document.getElementById('sheetBack');

document.getElementById('listToggle').addEventListener('click', ()=>{ renderList(); sheet.classList.add('open'); });
document.getElementById('sheetClose').addEventListener('click', ()=> sheet.classList.remove('open'));
sheetBack.addEventListener('click', ()=>{ renderList(); });

function gmapsUrl(p){ return `https://www.google.com/maps/place/?q=place_id:${p.place_id}`; }

function renderList(){
  sheetTitle.textContent = 'Tous les lieux';
  sheetBack.style.display = 'none';
  sheetBody.innerHTML = '';
  const order = { resto:0, plage:1, vue:2 };
  const items = PLACES.map((p,i)=>({p,i})).filter(o=>active[o.p.cat])
    .sort((a,b)=> order[a.p.cat]-order[b.p.cat] || (b.p.hero?1:0)-(a.p.hero?1:0));
  items.forEach(({p,i})=>{
    const cat = CATEGORIES[p.cat];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="rdot" style="background:${cat.color}"><svg viewBox="-10 -10 20 20">${cat.icon}</svg></div>
      <div>
        <div class="rname">${p.name}${p.hero?' ★':''}</div>
        <div class="rsub">${cat.label} · ${p.zone}</div>
      </div>`;
    row.addEventListener('click', ()=>{ openDetail(i); });
    sheetBody.appendChild(row);
  });
}

function slugify(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}

const galleryState = {};
let galleryCounter = 0;

function buildGallery(p){
  const slug = slugify(p.name);
  // Ordre : photo(s) perso images/<slug>-1.jpg, -2.jpg... (jusqu'à 6),
  // puis images/<slug>.jpg (sans numéro, au cas où), puis la photo libre
  // de droits si définie. Chaque source manquante est simplement ignorée.
  const candidates = [];
  for(let i=1;i<=6;i++) candidates.push(`images/${slug}-${i}.jpg`);
  candidates.push(`images/${slug}.jpg`);
  if(p.photo) candidates.push(p.photo);

  const galleryId = 'gal-' + (++galleryCounter);
  galleryState[galleryId] = { total: candidates.length, done: 0, ok: 0, catKey: p.cat };
  const imgsHtml = candidates.map(src =>
    `<img class="pc-photo" src="${src}" data-gallery="${galleryId}" alt="${p.name}"
       onload="galleryImgLoad(this)" onerror="galleryImgError(this)">`
  ).join('');
  return `<div class="pc-gallery-wrap">
    <div class="pc-gallery" id="${galleryId}">${imgsHtml}</div>
    <div class="pc-gallery-nav prev" onclick="scrollGallery('${galleryId}',-1)">‹</div>
    <div class="pc-gallery-nav next" onclick="scrollGallery('${galleryId}',1)">›</div>
  </div>`;
}
function scrollGallery(galleryId, dir){
  const el = document.getElementById(galleryId);
  if(el) el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' });
}
function galleryImgLoad(imgEl){
  imgEl.style.display = 'block';
  const st = galleryState[imgEl.dataset.gallery];
  if(st){ st.done++; st.ok++; }
}
function galleryImgError(imgEl){
  imgEl.remove();
  const st = galleryState[imgEl.dataset.gallery];
  if(!st) return;
  st.done++;
  if(st.done >= st.total && st.ok === 0){
    const gallery = document.getElementById(imgEl.dataset.gallery);
    const wrap = gallery ? gallery.closest('.pc-gallery-wrap') : null;
    if(wrap){ wrap.outerHTML = `<div class="pc-placeholder">${sceneFor(st.catKey)}</div>`; }
  }
}

function openDetail(idx){
  const p = PLACES[idx];
  const cat = CATEGORIES[p.cat];
  sheetTitle.textContent = cat.label;
  sheetBack.style.display = 'flex';
  sheetBody.innerHTML = `
    <div class="pc">
      ${buildGallery(p)}
      <div class="pc-body">
        <div class="pc-eyebrow"><span>${cat.label}${p.hero?' ★ coup de cœur':''}</span><span>${p.price}</span></div>
        <h3>${p.name}</h3>
        <div class="meta"><span class="tag">${p.zone}</span></div>
        <p>${p.desc}</p>
        <div class="rec">${p.rec}</div>
        <a class="gmaps" href="${gmapsUrl(p)}" target="_blank" rel="noopener">Voir les photos sur Google Maps →</a>
      </div>
    </div>`;
  map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 16), { duration: 0.6 });
  sheet.classList.add('open');
}

      <defs>
        <linearGradient id="skyV" x1="0" y1="0" x2="0" y2="1">

  // resto
  return `

      </g>
      <ellipse cx="200" cy="128" rx="90" ry="14" fill="#EDE3CC"/>

renderList();
</script>
